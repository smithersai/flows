name: Deploy apps

on:
  push:
    tags:
      - 'apps-v*'
  workflow_dispatch: {}

jobs:
  deploy:
    name: build + wrangler deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Real deploy runs only on a tag push AND only when the Cloudflare
      # credential is configured; every other trigger (workflow_dispatch, or
      # a tag push without the secret) proves the pipeline in --dry-run mode
      # instead. The Worker identity (smithers-mvp-web / canary.smithers.sh)
      # is frozen (apps/server/DEPLOY.md, apps/server/wrangler.jsonc:1-9) —
      # this workflow never edits wrangler.jsonc, only builds and deploys
      # what's already there.
      - name: Decide dry-run mode
        id: mode
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "$HAS_TOKEN" = "true" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy (dry-run)
        if: steps.mode.outputs.dry_run == 'true'
        run: pnpm --filter smithers-server run deploy:dry
      - name: Deploy (real)
        if: steps.mode.outputs.dry_run == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter smithers-server run deploy
      - name: Upload deploy receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-receipt
          path: apps/server/deploy-receipts/**/*.json
          if-no-files-found: warn
