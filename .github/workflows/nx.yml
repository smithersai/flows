name: Nx

# The Nx lane: the same gate surface as ci.yml's check/lint/test/build steps,
# planned and executed as Nx tasks over the project graph. `nx affected`
# restricts the run to the projects a change touches; the local task cache is
# carried between runs by actions/cache until an Nx Cloud workspace is
# connected (see docs/build-systems/nx.md, "Remote caching").

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  affected:
    name: nx affected (check, lint, fmt, circular, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Full history: nx-set-shas derives the base SHA from the merge base,
      # and a shallow checkout hides it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Same jj setup as ci.yml's test job: the jj and time-travel suites
      # exercise a real jj binary and refuse to skip silently.
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      # Local task cache, keyed on the lockfile. This is the baseline until a
      # human connects Nx Cloud (`pnpm exec nx connect`) and adds the
      # NX_CLOUD_ACCESS_TOKEN secret; the env var below is already wired for
      # that and is simply empty until then.
      - name: Restore the Nx task cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-
      # Two concurrent tasks: the heavy vitest suites carry finite 30 s
      # per-test budgets that host parallelism on a 4-core runner starves
      # when several run at once (same reasoning as ci.yml's smthrs lane).
      - name: Run affected tasks
        env:
          CI: "true"
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
        run: pnpm exec nx affected -t check,lint,fmt,circular,test,build --parallel=2

  # The Rust half of the graph. cargo-fmt runs here so `nx affected` covers
  # the crate; clippy, test, and the wasm reproducibility gate stay in
  # ci.yml's dedicated jobs because they need the submodule checkout and the
  # pinned toolchain, and the wasm gate is a deliberate no-cache rebuild.
  rust:
    name: nx cargo-fmt (crate graph membership)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # cargo resolves the workspace against the vendored jj-lib even for
          # fmt, so the submodule has to be present (same as ci.yml's rust job).
          submodules: recursive
      - uses: nrwl/nx-set-shas@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Run affected rust tasks
        run: pnpm exec nx affected -t cargo-fmt --parallel=2
