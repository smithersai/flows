name: Repro state machine
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
concurrency:
  group: "gen-issue-reply-${{ github.event.issue.number }}"
  cancel-in-progress: false
jobs:
  advance:
    name: advance the repro state
    runs-on: ubuntu-latest
    if: ${{ contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) || contains(github.event.issue.labels.*.name, 'agent:approved') || contains(github.event.pull_request.labels.*.name, 'agent:approved') }}
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run advance
        run: node factory/automation/advance.ts
        env:
          GH_TOKEN: "${{ github.token }}"
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
