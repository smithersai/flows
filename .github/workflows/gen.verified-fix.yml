name: Verified repro to pull request
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: The issue number this run is about
        required: true
permissions:
  contents: read
concurrency:
  group: "gen-verified-fix-${{ github.event.issue.number || inputs.issue }}"
  cancel-in-progress: false
jobs:
  fix:
    name: "queue the item, run the lane, open the pull request"
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) || contains(github.event.issue.labels.*.name, 'agent:approved') || contains(github.event.pull_request.labels.*.name, 'agent:approved')) && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'repro:verified' || github.event.label.name == 'agent:approved') }}
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install the agent CLI
        run: npm install --global @anthropic-ai/claude-code
      - name: Run fix
        run: node factory/automation/fix.ts
        env:
          GH_TOKEN: "${{ secrets.FACTORY_PR_TOKEN || github.token }}"
          ISSUE_NUMBER: "${{ inputs.issue }}"
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
