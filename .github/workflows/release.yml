name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: validate, build, and publish
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "Release tags must use the v<version> format." >&2; exit 1 ;;
          esac
          RELEASE_VERSION="${RELEASE_TAG#v}"
          # This is the flows engine train. The agent layer is a separate
          # release surface and will get its own train when it is release-ready.
          for manifest in packages/*/package.json; do
            package_group="$(node -p "require('./' + process.argv[1]).smthrs?.group ?? ''" "$manifest")"
            case "$package_group" in
              engine) ;;
              agent|tooling) continue ;;
              *) echo "$manifest has missing or unknown smthrs.group '$package_group'." >&2; exit 1 ;;
            esac
            package_version="$(node -p "require('./' + process.argv[1]).version" "$manifest")"
            if [ "$package_version" != "$RELEASE_VERSION" ]; then
              echo "$manifest has version $package_version; expected $RELEASE_VERSION." >&2
              exit 1
            fi
          done
      - name: Typecheck all workspaces
        run: pnpm run check
      - name: Test all workspaces
        run: pnpm test
      - name: Lint all workspaces
        run: pnpm run lint
      - name: Circular-dependency guard
        run: pnpm run circular
      # The gate roster here must stay a superset of ci.yml's. The browser
      # guard and the release manifest unit test are the two that used to run
      # only on the pull-request path, so a re-tag or a hotfix tag could
      # publish without them. scripts/pack-release.test.mjs asserts that.
      - name: Browser bundle guard
        run: pnpm run browser
      - name: Release manifest unit test
        run: node --test scripts/pack-release.test.mjs
      - name: Disaster-recovery script test
        run: node --test scripts/flows-backup.test.mjs
      - name: Test-pin register guard
        run: node --test scripts/check-test-pins.test.mjs
      - name: Build all workspaces from clean artifacts
        run: |
          find packages -type d -name dist -prune -exec rm -rf {} +
          pnpm --recursive --if-present run build
      # Pack from staging manifests whose exports point at built artifacts.
      # Repository manifests retain Effect's source-first export shape.
      - name: Pack and smoke-test release artifacts
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
        run: |
          node scripts/pack-release.mjs "$PACK_DIR"
          node scripts/smoke-release.mjs "$PACK_DIR"
      # The package set and its order come from scripts/pack-release.mjs, which
      # derives membership from the `engine` smthrs.group and order from the
      # workspace dependency edges. Reading manifest.json publishes exactly
      # what the pack step produced, in the packed order, so the lists cannot
      # drift or accidentally include the separate agent release surface.
      - name: Publish packages in dependency order
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          PUBLISH_ORDER: ${{ runner.temp }}/publish-order.txt
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          publish_tag="latest"
          case "$release_version" in *-*) publish_tag="next" ;; esac
          node -e '
            const { readFileSync } = require("node:fs")
            const packed = JSON.parse(readFileSync(process.env.PACK_DIR + "/manifest.json", "utf8"))
            for (const entry of packed) console.log(entry.name + " " + entry.filename)
          ' > "$PUBLISH_ORDER"
          while read -r workspace tarball; do
            spec="$workspace@$release_version"
            if pnpm view "$spec" version --json >/dev/null 2>&1; then
              echo "$spec is already published; leaving the immutable version in place."
              continue
            fi
            pnpm publish "$PACK_DIR/$tarball" --provenance --access public --tag "$publish_tag"
          done < "$PUBLISH_ORDER"
