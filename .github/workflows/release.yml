name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: validate, build, and publish
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          registry-url: https://registry.npmjs.org
      # Node 22.19.0 bundles npm 10.9.3; npm trusted publishing requires
      # npm 11.5.1 or newer. Pin the same CLI as ci.yml — 11.5.1 itself
      # crashes in Arborist when installing tarballs alongside registry
      # packages.
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.16.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "Release tags must use the v<version> format." >&2; exit 1 ;;
          esac
          RELEASE_VERSION="${RELEASE_TAG#v}"
          for manifest in packages/*/package.json; do
            package_version="$(node -p "require('./' + process.argv[1]).version" "$manifest")"
            if [ "$package_version" != "$RELEASE_VERSION" ]; then
              echo "$manifest has version $package_version; expected $RELEASE_VERSION." >&2
              exit 1
            fi
          done
      - name: Typecheck all workspaces
        run: npm run check
      - name: Test all workspaces
        run: npm test
      - name: Lint all workspaces
        run: npm run lint
      - name: Circular-dependency guard
        run: npm run circular
      - name: Build all workspaces from clean artifacts
        run: |
          find packages -type d -name dist -prune -exec rm -rf {} +
          npm run build --workspaces --if-present
      # Pack from staging manifests whose exports point at built artifacts.
      # Repository manifests retain Effect's source-first export shape.
      - name: Pack and smoke-test release artifacts
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
        run: |
          node scripts/pack-release.mjs "$PACK_DIR"
          node scripts/smoke-release.mjs "$PACK_DIR"
      - name: Publish packages in dependency order
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          publish_tag="latest"
          case "$release_version" in *-*) publish_tag="next" ;; esac
          publish_if_missing() {
            workspace="$1"
            spec="$workspace@$release_version"
            if npm view "$spec" version --json >/dev/null 2>&1; then
              echo "$spec is already published; leaving the immutable version in place."
              return
            fi
            tarball="${workspace#@}"
            tarball="${tarball/\//-}-$release_version.tgz"
            npm publish "$PACK_DIR/$tarball" --provenance --access public --tag "$publish_tag"
          }
          publish_if_missing @smthrs/canonical
          publish_if_missing @smthrs/capability
          publish_if_missing @smthrs/crypto
          publish_if_missing @smthrs/database
          publish_if_missing @smthrs/keys
          publish_if_missing @smthrs/jj
          publish_if_missing @smthrs/journal
          publish_if_missing @smthrs/run-store
          publish_if_missing @smthrs/step-cache
          publish_if_missing @smthrs/flow
          publish_if_missing @smthrs/engine
          publish_if_missing @smthrs/kernel
          publish_if_missing @smthrs/platform-browser
          publish_if_missing @smthrs/platform-node
          publish_if_missing @smthrs/platform-bun
          publish_if_missing @smthrs/sandbox
          publish_if_missing @smthrs/sync
          publish_if_missing @smthrs/engine-store
          publish_if_missing @smthrs/time-travel
          publish_if_missing @smthrs/flows
