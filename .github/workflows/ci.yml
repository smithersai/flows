name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: check + test (coverage gates enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # actionlint catches GitHub-only expression-context errors before any
      # workflow runs. Every file in .github/workflows/ is named here, and
      # apps/server/scripts/canary/workflow-wiring.test.ts fails when one is
      # missing: an unlinted workflow is a workflow whose expression errors
      # surface at 03:00 on a schedule instead of in review.
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.11
        with:
          args: .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/apps-deploy.yml .github/workflows/canary.yml .github/workflows/gen.issue-intake.yml .github/workflows/gen.issue-reply.yml .github/workflows/gen.poc-loop.yml .github/workflows/gen.pr-review.yml .github/workflows/gen.repro-proof.yml .github/workflows/gen.repro-reverify.yml .github/workflows/gen.verified-fix.yml
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Issue #163: the real-binary NodeJj suite requires jj on PATH; without
      # it the suite fails loudly on CI (it no longer skips silently).
      # install-action fetches the prebuilt jj-cli release binary — no cargo
      # build. Keep the version pinned.
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      # The Node/Bun host contracts exercise a successful `jj status` when
      # the binary is present. A GitHub checkout is not itself a jj repo, so
      # initialize the colocated metadata before those contracts run.
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Typecheck all workspaces
        run: pnpm run check
      # Issue #38: lint (eslint --max-warnings=0 + dprint) and the
      # circular-dependency guard gate every workspace — the issue-#8 class
      # of lint-only regression can no longer merge green.
      - name: Lint all workspaces
        run: pnpm run lint
      - name: Documentation parity
        run: pnpm exec smthrs docs '//...'
      - name: Factory automation typecheck
        run: pnpm exec tsc -p factory/automation/tsconfig.json
      - name: Factory automation tests
        run: node --test 'factory/automation/*.test.ts'
      - name: Circular-dependency guard
        run: pnpm run circular
      # Browser support is a hard requirement met through layers: the contract
      # entry points must bundle for the browser, and the documented Node-only
      # ones must still be Node-only. scripts/browser-check.mjs gates both.
      - name: Browser bundle guard
        run: pnpm run browser
      - name: Release manifest unit test
        run: node --test scripts/pack-release.test.mjs
      # The dry-run path of release.yml is a promise about publication: a
      # dispatched rehearsal must skip the publish step and a tag push must not.
      # These assertions read release.yml itself, so an edit that breaks either
      # half fails here instead of at the next release.
      - name: Release rehearsal unit test
        run: node --test scripts/release-rehearsal.test.mjs
      # Publishing at a new version means retargeting the exact internal ranges
      # too, or the published set depends on a version nobody published. The
      # last case here asserts the tree is coherent at whatever version it
      # currently carries.
      - name: Release version coherence
        run: node --test scripts/set-release-version.test.mjs
      # The operator's backup/verify/restore entry point, driven the way an
      # operator drives it: spawned invocations against a real migrated store.
      - name: Disaster-recovery script test
        run: node --test scripts/flows-backup.test.mjs
      # A test the default gate never runs to a pass is only acceptable when it
      # is written down. This fails on any pin in the engine or tooling groups
      # that docs/alpha-notes.md does not explain.
      - name: Test-pin register guard
        run: node --test scripts/check-test-pins.test.mjs
      # Package vitest configs with `coverage.enabled: true` compute and
      # enforce their coverage thresholds on every run — a red gate fails CI.
      - name: Test all workspaces
        run: pnpm test
      - name: Build all workspaces from clean artifacts
        run: |
          find packages -type d -name dist -prune -exec rm -rf {} +
          pnpm --recursive --if-present run build
      - name: Pack and smoke-test release artifacts
        env:
          PACK_DIR: ${{ runner.temp }}/release-packs
        run: |
          node scripts/pack-release.mjs "$PACK_DIR"
          node scripts/smoke-release.mjs "$PACK_DIR"

  # Issue I-1: the apps' end-to-end suites. Before this job the tree's only
  # e2e coverage ran on one laptop by hand — `pnpm test` resolves to
  # `bun test src` per workspace, which is unit only.
  #
  # This is a separate job, not a step of `test`, on purpose. It boots
  # wrangler dev and a real Chrome, so folding it into the unit gate would put
  # minutes of browser work in front of every push for no added signal.
  apps-e2e:
    name: apps e2e (worker + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # No jj here. The `test` job installs jj and colocates the checkout for
      # packages/jj and packages/time-travel; nothing under apps/ imports
      # @smthrs/jj or spawns the binary, so both steps would only cost time.
      #
      # No Chrome install step either: the ubuntu-latest image ships Google
      # Chrome stable at /usr/bin/google-chrome, which BROWSER_CANDIDATES in
      # apps/ui/src/launch-checklist/BrowserLaunch.ts already probes. Assert
      # it rather than assume it, so an image change fails here with a
      # readable message instead of inside a CDP connect timeout.
      - name: Assert the runner ships a browser findBrowser can discover
        run: |
          if [ ! -x /usr/bin/google-chrome ]; then
            echo "/usr/bin/google-chrome is missing from this runner image." >&2
            echo "findBrowser only probes BROWSER_CANDIDATES" >&2
            echo "(apps/ui/src/launch-checklist/BrowserLaunch.ts). Install Chrome" >&2
            echo "at one of those paths, or set CHECKLIST_BROWSER on this job." >&2
            exit 1
          fi
          /usr/bin/google-chrome --version
      # Hermetic: builds the SPA, boots `wrangler dev` against
      # scripts/stub-backends.ts twice, and asserts 26 named outcomes. workerd
      # runs locally, so no Cloudflare credential is involved and no model
      # spend happens.
      - name: Worker e2e
        run: pnpm --filter smithers-ui run test:e2e:worker
      - name: Browser e2e
        run: pnpm --filter smithers-ui run test:e2e
      # Screenshots land in /tmp and launch-checklist reports under
      # apps/reports; collect both into one directory so the upload has a
      # single root.
      #
      # Both steps run unconditionally, and deliberately carry no `if:`.
      # packages/flows/test/vitestCoverageIsolation.test.ts (issue #176) pins
      # `expect(ci).not.toMatch(/^\s*if:/m)` — no step condition anywhere in
      # this file — so that nobody has to adjudicate in review which
      # conditions are load-bearing. `|| true` on each copy and
      # `if-no-files-found: ignore` on the upload give the same result on a
      # green run: an empty collection and no artifact. Do not "fix" this by
      # adding `if: failure()`; it will fail that pin.
      - name: Collect e2e artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-artifacts"
          cp /tmp/smithers-*.png "$RUNNER_TEMP/e2e-artifacts/" 2>/dev/null || true
          cp -R apps/reports "$RUNNER_TEMP/e2e-artifacts/reports" 2>/dev/null || true
      - name: Upload e2e artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apps-e2e-artifacts
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore

  # rust-toolchain.toml pins the toolchain for the two Rust jobs; a bare
  # `rustup toolchain install` reads it, so the pin cannot drift from what CI
  # runs. It also pins the wasm32-wasip1 target and the rustfmt and clippy
  # components.
  rust:
    name: rust fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # jj-lib is a git submodule at vendor/jj; the crates in crates/ build
      # against it, so the checkout has to bring it down or the job dies on a
      # missing vendor/jj/lib/Cargo.toml.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      # Registry state and compiled dependencies, keyed on Cargo.lock. The
      # native jj-lib build dominates this job's time without it.
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  # The committed packages/jj/wasm/flows_jj.wasm is a reproducibility
  # contract: rebuilding it from source with the pinned toolchain must give
  # the same bytes. build-wasm.mjs remaps every machine-specific source
  # prefix (checkout path, CARGO_HOME, toolchain sysroot) to fixed tokens,
  # which is what makes the comparison meaningful across machines. No build
  # cache here on purpose — the rebuild is the point.
  #
  # This runner's host triple is part of the contract. Cargo builds build
  # scripts for the host, so their metadata hash — and every symbol hash
  # above them — carries the host triple, and the same sources produce a
  # different module on macOS or on arm64 Linux. The committed bytes are the
  # x86_64-unknown-linux-gnu build; build-wasm.mjs refuses to run on any
  # other host, so a runner change fails here with that message rather than
  # a byte diff.
  wasm-repro:
    name: wasm reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Same reason as the rust job: the wasm rebuild compiles jj-lib from the
      # vendor/jj submodule.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Build-script unit tests
        run: node --test crates/flows-jj/build-wasm.test.mjs
      - name: Rebuild flows_jj.wasm from source
        env:
          # A scratch target dir keeps the rebuild clean-room and exercises
          # the script's CARGO_TARGET_DIR handling.
          CARGO_TARGET_DIR: ${{ runner.temp }}/wasm-target
        run: |
          cp packages/jj/wasm/flows_jj.wasm "$RUNNER_TEMP/flows_jj.committed.wasm"
          node crates/flows-jj/build-wasm.mjs
      - name: Byte-compare against the committed artifact
        run: |
          if ! cmp "$RUNNER_TEMP/flows_jj.committed.wasm" packages/jj/wasm/flows_jj.wasm; then
            echo "packages/jj/wasm/flows_jj.wasm does not reproduce from source." >&2
            echo "Rebuild it with the pinned toolchain on x86_64-unknown-linux-gnu" >&2
            echo "and commit the result. On that host:" >&2
            echo "  node crates/flows-jj/build-wasm.mjs" >&2
            echo "On any other host the same script prints the container command." >&2
            exit 1
          fi

  # Runtime-compatibility check: the suites below pass under bun today
  # (verified locally on bun 1.3.14, 2026-08-15). The pin has to name a
  # published oven-sh/bun release: setup-bun downloads the release asset, so a
  # version that exists only as a local build 404s. Coverage is disabled because
  # @vitest/coverage-v8 needs V8's inspector and bun runs JavaScriptCore; the
  # Node `test` job stays the coverage gate.
  #
  # Excluded suites, with the failure that keeps each one out:
  # - database, engine-store, flows, journal, kernel, plan, run-store,
  #   step-cache, sync, time-travel (and examples): bun's node:sqlite binds
  #   the host SQLite, built with SQLITE_OMIT_LOAD_EXTENSION, which the
  #   @effect/sql-sqlite-node layer requires.
  # - jj: NodeJjClassification expects spawn failures to classify as
  #   'unknown'; bun's child_process error shape classifies as
  #   'not_installed'.
  # - platform-node: the Node host contract suite asserts Node-host
  #   behavior and is not expected to pass on bun.
  bun:
    name: test on bun
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Same jj setup as the Node job: the Bun host contract exercises a
      # successful `jj status` when the binary is present.
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Test bun-compatible suites
        run: |
          for pkg in artifacts canonical capability crypto engine flow keys platform-browser platform-bun sandbox; do
            (cd "packages/$pkg" && bun node_modules/vitest/vitest.mjs run --coverage.enabled=false)
          done

  # The browser contract as its own gate. scripts/browser-check.mjs bundles
  # every browser entry point and pins the documented Node-only ones. No real
  # browser-runner suite exists in this repo yet (no playwright, webdriverio,
  # or @vitest/browser tests); when one lands, run it here instead of
  # inventing a new harness.
  browser:
    name: browser bundle gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Browser bundle guard
        run: pnpm run browser

  # Advisory OS coverage for the Node suite. Both jobs become required (drop
  # continue-on-error) once they prove a stable green streak. Windows path
  # pitfalls are expected and are not chased in this lane.
  node-macos:
    name: node suite (macOS, advisory)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Test all workspaces
        run: pnpm test

  # Shadow lane for the dogfooded build system: the same gate surface as the
  # `test` job's check/lint/test steps, planned and executed as smithers build
  # targets (lib+check, lint+fmt, test — 130 targets over 26 packages).
  # Advisory until it holds a green streak with verdicts matching the pnpm
  # gates; then it becomes required and the recursive scripts retire.
  smthrs-shadow:
    name: smthrs ci (shadow, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Same jj setup as the Node job: the jj and time-travel suites exercise
      # a real jj binary and refuse to skip silently.
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      # Two concurrent targets: the heavy vitest suites carry finite 30s
      # per-test budgets that host parallelism on a 4-core runner starves
      # when several run at once.
      - name: Execute the merged ci graph
        run: node packages/build-cli/src/main.js ci "//packages/..." --jobs 2

  node-windows:
    name: node suite (Windows, advisory)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install jj
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.39.0
      - name: Initialize colocated jj repository
        run: jj git init --colocate
      - name: Test all workspaces
        run: pnpm test
